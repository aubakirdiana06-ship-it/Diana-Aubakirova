<style>
  :root {
    --sky-top: #7cc0f4;
    --sky-bottom: #e6f4fe;
    --bg: #f3f9fe;
    --surface: #ffffff;
    --ink: #0f2a4a;
    --muted: #4d6785;
    --rule: #cfe3f3;
    --blue: #1a6fd4;
    --blue-soft: #dcecfb;
    --sun: #ffb52e;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Figtree", "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {

      --ink: #e6f1fc; --muted: #9bb6d4; --rule: #223f66; --blue: #6db3ff; --blue-soft: #19365e;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.65 var(--body); }
  a { color: var(--blue); }
  button { font: inherit; color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  /* Hero: open sky */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    padding: 4rem clamp(1.25rem, 6vw, 5rem) 5rem;
  }
  .clouds { position: absolute; inset: 0; pointer-events: none; }
  .cloud { position: absolute; fill: #fff; opacity: .75; animation: drift 60s linear infinite alternate; }
  .c1 { width: 280px; top: 14%; left: 6%; }
  .c2 { width: 200px; top: 52%; right: 8%; animation-duration: 80s; opacity: .6; }
  .c3 { width: 340px; top: 70%; left: 38%; animation-duration: 95s; opacity: .5; }
  @keyframes drift { to { transform: translateX(70px); } }
  @media (prefers-reduced-motion: reduce) { .cloud { animation: none; } }
  @media (prefers-color-scheme: dark) { .cloud { opacity: .08; } }

  .hero-inner { position: relative; max-width: 62rem; margin: 0 auto; display: flex; gap: 2.5rem; align-items: center; flex-wrap: wrap; }
  .photo {
    width: 180px; height: 180px; border-radius: 50%; overflow: hidden; flex: none;
    border: 5px solid #fff; box-shadow: 0 0 0 5px var(--sun);
    background: var(--blue); color: #fff; display: grid; place-items: center; font: 800 3rem var(--display);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font: 800 clamp(2.8rem, 8vw, 5.5rem)/0.95 var(--display); letter-spacing: -0.035em; margin: 0 0 1.5rem; color: #0b2a52; }
  @media (prefers-color-scheme: dark) { .name { color: #fff; } }
  .chips { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--surface); color: var(--ink); text-decoration: none;
    border: 0; border-radius: 999px; padding: 0.5rem 1rem; font-weight: 500; font-size: 0.97rem; cursor: pointer;
    box-shadow: 0 2px 8px rgba(15,42,74,.12);
  }
  .chip:hover { box-shadow: 0 3px 12px rgba(15,42,74,.22); }
  .chip.primary { background: var(--ink); color: #fff; }
  @media (prefers-color-scheme: dark) { .chip.primary { background: var(--sun); color: #0a1a30; } }

  /* Sticky nav with scroll-spy */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  nav ul { list-style: none; margin: 0 auto; padding: 0.4rem clamp(1rem, 6vw, 5rem); max-width: 62rem + 10rem; display: flex; gap: 0.25rem; overflow-x: auto; }
  nav a { display: block; padding: 0.55rem 0.9rem; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
